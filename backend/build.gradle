plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ee.testiplatvorm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
    imports {
        // Spring AI BOM - annab versiooni spring-ai-starter-model-google-genai sõltuvusele
        mavenBom 'org.springframework.ai:spring-ai-bom:2.0.1'
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework:spring-test'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

    // Swagger - Updated to compatible version for Spring Boot 3.5.x
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // MapStruct - Already at latest version
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // SQL with parameter values
    implementation 'p6spy:p6spy:3.9.1'
}

compileJava {
    // Ignoring Unmapped Properties (no error, no warning), Inject Spring Components into the Mapper
    options.compilerArgs += ['-Amapstruct.unmappedTargetPolicy=IGNORE', '-Amapstruct.defaultComponentModel=spring']
}

tasks.named('test') {
	useJUnitPlatform()
}

// "reset db" nupp IntelliJ-s: käivitab docs/database skriptid järjest (kustutab kõik andmed!)
configurations {
    dbDriver
}

dependencies {
    dbDriver 'org.postgresql:postgresql'
}

tasks.register('resetDb') {
    group = 'database'
    description = 'Käivitab docs/database/1_reset_database.sql, 2_create.sql ja 3_import.sql'
    doLast {
        def appProperties = new Properties()
        file('src/main/resources/application.properties').withInputStream { appProperties.load(it) }
        def credentials = new Properties()
        credentials.user = appProperties['spring.datasource.username']
        credentials.password = appProperties['spring.datasource.password']

        def classLoader = new URLClassLoader(configurations.dbDriver.collect { it.toURI().toURL() } as URL[])
        def driver = classLoader.loadClass('org.postgresql.Driver').getDeclaredConstructor().newInstance()
        driver.connect('jdbc:postgresql://localhost:5432/vali_it', credentials).withCloseable { connection ->
            ['1_reset_database.sql', '2_create.sql', '3_import.sql'].each { fileName ->
                connection.createStatement().withCloseable { statement ->
                    statement.escapeProcessing = false
                    statement.execute(file("../docs/database/$fileName").getText('UTF-8'))
                }
                println "OK: $fileName"
            }
        }
    }
}
